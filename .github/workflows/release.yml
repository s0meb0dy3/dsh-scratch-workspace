name: Release

# Publishing happens only from a version tag, and only through npm Trusted
# Publishing (OIDC). There is no NPM_TOKEN anywhere in this repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and test without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build:check

      - run: npm test

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json $PKG"
            exit 1
          fi

      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: npm publish --access public --provenance

      - name: Dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == true }}
        run: npm pack --dry-run
